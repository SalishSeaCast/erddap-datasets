name: check-datasets-xml

permissions: {}

on:
  push:
    branches: [ '*' ]

# Helps prevent parallel runs of the workflow from overlapping
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-datasets-xml:
    name: Run check-datasets-xml.py
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to access repository contents to run the check-datasets-xml.py script
    strategy:
      fail-fast: false
      matrix:
        environment: [ 'test' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false  # Required to avoid exposing secrets to pytest run in forked PRs

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          cache: true
          environments: ${{ matrix.environment }}

      - name: Run check_datasets_xml.py
        run: pixi run -e ${INPUTS_ENVIRONMENT} python -m check_datasets_xml
        env:
          INPUTS_ENVIRONMENT: ${{ matrix.environment }}
