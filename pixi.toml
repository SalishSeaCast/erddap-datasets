[workspace]
authors = ["Doug Latornell <dlatornell@eoas.ubc.ca>"]
channels = ['conda-forge']
name = "erddap-datasets-dev"
platforms = ['linux-64', "osx-arm64"]
version = "26.1"
readme = "README.rst"
repository = "https://github.com/erddap/erddap-datasets"

[tasks]
check-datasets-xml = "python -m check_datasets_xml"
build-datasets-xml = "python -m build_datasets_xml"

[dependencies]
docutils = ">=0.23,<0.24"
jupyterlab = ">=4.6.6,<5"
lxml = ">=6.1.3,<7"
netcdf4 = ">=1.7.5,<2"
pip = ">=26.2.2,<27"
python = ">=3.15.2,<4"
pyyaml = ">=6.0.3,<7"
rich = ">=15.0.0,<16"
structlog = ">=26.1.0,<27"
xarray = ">=2026.9.0,<2027"

# For coding style and repo QA
pre-commit = ">=4.7.0,<5"
